<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SlayDesk</title>
  <meta name="description" content="SlayDesk — desk booking and workplace analytics. Showcase MVP that runs entirely in your browser." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d4aff'/%3E%3Crect x='7' y='12' width='18' height='9' rx='2' fill='white'/%3E%3Ccircle cx='23' cy='9' r='3' fill='%2322c55e'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" class="brand-bg"/><rect x="7" y="12" width="18" height="9" rx="2" fill="#fff"/><circle cx="23" cy="9" r="3" class="brand-dot"/></svg>
        <span>SlayDesk</span>
      </a>
      <nav class="role-switch" aria-label="Role">
        <a href="#/admin/floor" data-role="admin">Company admin</a>
        <a href="#/employee/book" data-role="employee">Employee</a>
      </nav>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn" id="resetBtn" title="Reset demo data" aria-label="Reset demo data">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="foot">
    SlayDesk showcase MVP · all data lives in your browser (localStorage) · open the admin and employee views in two tabs to watch them sync live.
  </footer>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
